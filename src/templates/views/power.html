<div class="power-view">
  <section class="power-summary" id="power-summary" aria-busy="true">
    <div class="power-summary-main">
      <span class="power-eyebrow">Power management</span>
      <h2 class="power-headline" id="power-headline">Checking this machine…</h2>
      <p class="power-summary-text" id="power-summary-text"></p>
    </div>
    <div class="power-summary-side">
      <span class="power-capability" id="power-capability">—</span>
      <button type="button" class="power-action-btn" id="btn-power-recheck">Re-check</button>
    </div>
  </section>

  <section class="power-panel" id="power-claims-panel" aria-busy="true">
    <h3 class="power-panel-title">Who owns what</h3>
    <ul class="power-claim-list" id="power-claim-list"></ul>
  </section>

  <section class="power-panel" id="power-findings-panel" aria-busy="true">
    <h3 class="power-panel-title">Diagnosis</h3>
    <p class="power-panel-note" id="power-findings-note"></p>
    <ul class="power-finding-list" id="power-finding-list"></ul>
  </section>
</div>

<div class="overview">
  <!-- What the machine is. The model is the largest thing on the page. -->
  <section class="overview-identity" id="overview-identity" aria-busy="true">
    <div class="overview-identity-main">
      <span class="overview-eyebrow" id="overview-vendor">Reading hardware…</span>
      <h1 class="overview-model" id="overview-model">—</h1>
      <p class="overview-subline">
        <span id="overview-model-code"></span>
        <span id="overview-bios"></span>
      </p>
    </div>
    <div class="overview-identity-side">
      <div class="overview-serial">
        <span class="overview-label">Serial number</span>
        <span class="overview-serial-value" id="overview-serial">Not read yet</span>
      </div>
      <button
        type="button"
        class="overview-btn"
        id="btn-copy-serial"
        title="Copy this machine's serial number"
      >
        Copy serial
      </button>
    </div>
  </section>

  <div class="overview-grid">
    <section class="overview-card" id="card-cpu" aria-busy="true">
      <header class="overview-card-head">
        <h2>Processor</h2>
        <span class="overview-chip" id="cpu-governor">—</span>
      </header>
      <p class="overview-primary" id="cpu-model">Reading…</p>
      <dl class="overview-metrics" id="cpu-metrics"></dl>
    </section>

    <section class="overview-card" id="card-gpu" aria-busy="true">
      <header class="overview-card-head">
        <h2>Graphics</h2>
        <span class="overview-chip" id="gpu-driver">—</span>
      </header>
      <p class="overview-primary" id="gpu-name">Reading…</p>
      <dl class="overview-metrics" id="gpu-metrics"></dl>
    </section>

    <section class="overview-card" id="card-memory" aria-busy="true">
      <header class="overview-card-head">
        <h2>Memory</h2>
        <span class="overview-chip" id="memory-speed">—</span>
      </header>
      <p class="overview-primary" id="memory-summary">Reading…</p>
      <div class="overview-bar" aria-hidden="true">
        <div class="overview-bar-fill" id="memory-bar"></div>
      </div>
      <dl class="overview-metrics" id="memory-metrics"></dl>
    </section>

    <section class="overview-card" id="card-storage" aria-busy="true">
      <header class="overview-card-head">
        <h2>Storage</h2>
        <span class="overview-chip" id="storage-health">—</span>
      </header>
      <p class="overview-primary" id="storage-model">Reading…</p>
      <dl class="overview-metrics" id="storage-metrics"></dl>
    </section>
  </div>

  <section class="overview-card overview-card-wide" id="overview-power" aria-busy="true">
    <header class="overview-card-head">
      <h2>Power</h2>
      <span class="overview-chip" id="power-source">—</span>
    </header>
    <div
      class="overview-profiles"
      id="overview-profiles"
      role="group"
      aria-label="Power profile"
    ></div>
    <dl class="overview-metrics overview-metrics-wide" id="power-metrics"></dl>
    <p class="overview-note" id="power-note"></p>
  </section>
</div>

name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
  # Re-deploy after a release so the bundled apt repository (gh-pages/apt) on the
  # site stays in step with the freshly published packages.
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      # GitHub Pages now serves the Actions artifact, not the gh-pages branch, so
      # the APT repository the release workflow publishes to gh-pages/apt would
      # otherwise 404. Fold it into the deployed site so install docs are true.
      - name: Bundle the apt repository
        run: |
          set -euo pipefail
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git archive gh-pages apt | tar -x -C docs/.vitepress/dist
            echo "Bundled gh-pages/apt into the deployed site."
          else
            echo "No gh-pages branch yet; skipping apt bundle."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
